<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Space Reservation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .admin-red { background-color: #8b0000; }
        /* สไตล์ Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col overflow-x-hidden">

    <header class="bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            
            <!-- ฝั่งซ้าย: โลโก้และชื่อภาควิชา -->
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-12 sm:h-16">
                <div>
                    <h1 class="text-sm sm:text-lg font-bold text-gray-800 leading-tight">Department of Mining and Petroleum Engineering</h1>
                    <p class="text-[10px] sm:text-sm text-gray-600 uppercase tracking-tighter">Faculty of Engineering, Chulalongkorn University</p>
                </div>
            </div>

            <!-- ฝั่งขวา: กลุ่มปุ่มเมนูจัดการบัญชี (มัดรวมกันเพื่อให้อยู่ชิดขวา) -->
            <div class="flex items-center">
                <!-- ปุ่มเปลี่ยนรหัสผ่าน (ไม่มีอีโมจิ สไตล์มินิมอล) -->
                <button onclick="openPasswordModal()" class="text-xs font-bold text-gray-500 hover:text-indigo-600 transition-colors uppercase tracking-wider mr-3 sm:mr-4">
                    Change Password
                </button>
                
                <!-- เส้นคั่นแนวตั้ง (Divider) -->
                <div class="h-4 w-px bg-gray-300 mr-3 sm:mr-4"></div>
                
                <!-- ปุ่มออกจากระบบ (มีกรอบ ดูเป็นปุ่ม Action หลัก) -->
                <button onclick="logout()" class="text-xs border border-gray-300 text-gray-600 px-3 py-1.5 rounded hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 transition-all uppercase font-bold whitespace-nowrap">
                    Sign Out
                </button>
            </div>

        </div>
    </header>

    <nav class="admin-red shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-12 flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-white font-bold tracking-widest text-sm uppercase">Admin Control</span>
            </div>
            <div id="admin-display" class="text-white/90 text-xs italic font-medium bg-black/20 px-3 py-1 rounded-full">
                ADMINISTRATION PANEL
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto py-8 px-4 sm:px-6 lg:px-8 flex flex-col">
        
        <div class="bg-white p-4 sm:p-6 rounded-lg shadow-sm border border-gray-200 w-full overflow-hidden flex flex-col">
            
            <div class="flex border-b border-gray-200 mb-6 justify-between items-end flex-wrap gap-4">
                <div class="flex gap-2 overflow-x-auto custom-scrollbar w-full sm:w-auto">
                    <button id="tab-management" onclick="switchAdminTab('management')" 
                        class="py-3 px-6 font-bold text-sm border-b-2 border-indigo-600 text-indigo-700 focus:outline-none uppercase tracking-wide whitespace-nowrap transition-colors">
                        Booking Management
                    </button>
                    <button id="tab-room-status" onclick="switchAdminTab('room-status')" 
                        class="py-3 px-6 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 hover:border-gray-300 focus:outline-none uppercase tracking-wide whitespace-nowrap transition-colors">
                        Room Status Grid
                    </button>
                    <button id="tab-admin-book" onclick="switchAdminTab('admin-book')" 
                        class="py-3 px-6 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 hover:border-gray-300 focus:outline-none uppercase tracking-wide whitespace-nowrap transition-colors">
                        ➕ Quick Book (Auto-Approve)
                    </button>

                </div>
                <button onclick="loadAdminSchedule()" class="text-xs font-bold bg-white hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg shadow-sm transition-colors border border-gray-300 flex items-center gap-2">
                    ↻ Refresh Data
                </button>
            </div>
            
            <div id="content-management" class="w-full">
                <div id="admin-table-container" class="w-full"></div>
            </div>

            <div id="content-room-status" class="hidden space-y-4 w-full">
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border w-full sm:w-fit">
                    <label for="admin-view-date" class="text-sm font-semibold text-gray-700 whitespace-nowrap">Select Date:</label>
                    <input type="date" id="admin-view-date" onchange="loadAdminSchedule()" 
                        class="rounded-md border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-600 w-full sm:w-auto">
                </div>
                <div id="admin-timetable-container" class="w-full"></div>
            </div>
            <div id="content-admin-book" class="hidden w-full max-w-lg mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-200 mt-4">
                <h2 class="text-lg font-bold mb-4 text-gray-800 border-b border-gray-200 pb-3">Quick Reservation (Admin Bypass)</h2>
                <form id="admin-booking-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Admin Name</label>
                        <input type="text" id="admin-name" readonly required class="w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-500 cursor-not-allowed">
                        <input type="hidden" id="admin-staffId">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Room Selection</label>
                        <select id="admin-room" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Reservation Date</label>
                        <input type="date" id="admin-date" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1">
                        <p class="text-[10px] text-gray-500 mt-1">* Admins can select any past or future date.</p>
                    </div>
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Start Time</label>
                            <select id="admin-startTime" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1"></select>
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">End Time</label>
                            <select id="admin-endTime" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1"></select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase">Purpose</label>
                        <textarea id="admin-reason" rows="2" required placeholder="Reason for booking..." class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1"></textarea>
                    </div>
                    <button type="submit" id="admin-submit-btn" class="w-full flex justify-center py-3 px-4 rounded-md shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none transition-all uppercase mt-2">
                        Force Book (Auto-Approve)
                    </button>
                </form>
            </div>

        </div>

    </main>

    <script src="js/config.js?v=999"></script>
    <script src="js/admin.js"></script>

    <div id="password-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 transform transition-all border border-gray-100 mx-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-gray-800 tracking-wide uppercase">Change Password</h3>
                <button onclick="closePasswordModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <form id="change-password-form" onsubmit="handleChangePasswordSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Current Password</label>
                    <input type="password" id="old-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 bg-gray-50">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">New Password</label>
                    <input type="password" id="new-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Confirm New Password</label>
                    <input type="password" id="confirm-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1">
                </div>
                
                <button type="submit" id="change-pw-submit-btn" onclick="handleChangePasswordSubmit(event)" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition-all uppercase tracking-widest text-xs mt-4 shadow-md">
                    Update Password
                </button>
            </form>
        </div>
    </div>




</body>
</html>
