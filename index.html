<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservation - Department of Mining and Petroleum Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .chula-navy { background-color: #2b3990; }
        /* สไตล์เพิ่มเติมสำหรับแฮนเดิลตาราง Grid เวลา */
        .grid-table th, .grid-table td { min-width: 90px; text-align: center; }
        .grid-table th:first-child, .grid-table td:first-child { min-width: 200px; text-align: left; position: sticky; left: 0; background-color: white; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-16">
                <div>
                    <h1 class="text-lg font-bold text-gray-800 leading-tight">Department of Mining and Petroleum Engineering</h1>
                    <p class="text-sm text-gray-600 uppercase tracking-tighter">Faculty of Engineering, Chulalongkorn University</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs border border-gray-300 text-gray-600 px-3 py-1.5 rounded hover:bg-gray-100 transition-colors uppercase font-medium">
                Log Out
            </button>
        </div>
    </header>

    <nav class="chula-navy shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-12 flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-white font-bold tracking-widest text-sm uppercase">Space Reservation</span>
            </div>
            <div id="user-display" class="text-white/90 text-xs italic font-medium">
                Loading Profile...
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto py-8 px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row gap-8">
        
        <div class="flex-1 bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
            
            <div class="flex border-b border-gray-200 mb-4">
                <button id="tab-timetable" onclick="switchTab('timetable')" 
                    class="py-2.5 px-6 font-semibold text-sm border-b-2 border-blue-800 text-blue-800 focus:outline-none uppercase tracking-wider">
                    Timetable
                </button>
                <button id="tab-my-booking" onclick="switchTab('my-booking')" 
                    class="py-2.5 px-6 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 focus:outline-none uppercase tracking-wider">
                    My Reservations
                </button>
            </div>

            <div id="content-timetable" class="space-y-4">
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded border">
                    <label for="view-date" class="text-sm font-semibold text-gray-700">Select Date:</label>
                    <input type="date" id="view-date" onchange="loadSchedule()" 
                        class="rounded border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:border-blue-800">
                </div>
                
                <div id="timetable-container" class="overflow-x-auto border rounded-lg bg-gray-50 min-h-[300px]">
                    </div>
            </div>

            <div id="content-my-booking" class="hidden overflow-x-auto">
                <div id="my-reservations-container" class="min-h-[300px]">
                    </div>
            </div>

        </div>

        <div class="w-full lg:w-1/3 bg-white p-6 rounded-lg shadow-sm border border-gray-200 h-fit">
            <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2 italic">Booking Request</h2>
            
            <form id="booking-form" class="space-y-4">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล (Lecturer Name)</label>
                    <input type="text" id="name" readonly required 
                        class="w-full rounded-md border border-gray-300 bg-gray-100 px-3 py-2 text-sm text-gray-500 cursor-not-allowed focus:outline-none">
                </div>

                <div>
                    <label for="staffId" class="block text-sm font-medium text-gray-700 mb-1">รหัสอาจารย์ (Staff ID)</label>
                    <input type="text" id="staffId" readonly required 
                        class="w-full rounded-md border border-gray-300 bg-gray-100 px-3 py-2 text-sm text-gray-500 cursor-not-allowed focus:outline-none">
                </div>

                <div>
                    <label for="room" class="block text-sm font-medium text-gray-700 mb-1">Room Selection</label>
                    <select id="room" required 
                        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-800">
                        <option value="">-- Select Room --</option>
                        <option value="ห้อง 301 (Smart Classroom)">ห้อง 301 (Smart Classroom)</option>
                        <option value="ห้อง 302 (Meeting Room)">ห้อง 302 (Meeting Room)</option>
                        <option value="ห้อง Lab (Rock Mechanics)">ห้อง Lab (Rock Mechanics)</option>
                        <option value="ห้อง Lab (Petroleum)">ห้อง Lab (Petroleum)</option>
                    </select>
                    
                    <div id="room-image-container" class="mt-3 hidden">
                        <img id="room-image" src="" alt="Room Preview" class="w-full h-48 object-cover rounded-md border border-gray-200 shadow-sm">
                    </div>
                </div>

                <div>
                    <label for="date" class="block text-sm font-medium text-gray-700 mb-1">วันที่ต้องการจอง (Date)</label>
                    <input type="date" id="date" required 
                        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-800">
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">เวลาเริ่ม</label>
                        <input type="time" id="startTime" required step="1800"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none">
                    </div>
                    <div class="flex-1">
                        <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">เวลาจบ</label>
                        <input type="time" id="endTime" required step="1800"
                            class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none">
                    </div>
                </div>

                <div>
                    <label for="reason" class="block text-sm font-medium text-gray-700 mb-1">จุดประสงค์ (Purpose of use)</label>
                    <textarea id="reason" rows="3" required
                        class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-800 focus:ring-1 focus:ring-blue-800"></textarea>
                </div>

                <button type="submit" id="submit-btn" 
                    class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white chula-navy hover:opacity-90 focus:outline-none transition-all uppercase tracking-widest">
                    Submit Request
                </button>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
