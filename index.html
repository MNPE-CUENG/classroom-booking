<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Reservation - Department of Mining and Petroleum Engineering</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .chula-navy { background-color: #2b3990; }
        /* สไตล์ Scrollbar ให้ดูพรีเมียมและเลื่อนง่ายบนคอมพิวเตอร์ */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col overflow-x-hidden">

    <header class="bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            
            <!-- ฝั่งซ้าย: โลโก้และชื่อภาควิชา -->
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-12 sm:h-16">
                <div>
                    <h1 class="text-sm sm:text-lg font-bold text-gray-800 leading-tight">Department of Mining and Petroleum Engineering</h1>
                    <p class="text-[10px] sm:text-sm text-gray-600 uppercase tracking-tighter">Faculty of Engineering, Chulalongkorn University</p>
                </div>
            </div>

            <!-- ฝั่งขวา: กลุ่มปุ่มเมนูจัดการบัญชี (มัดรวมกันเพื่อให้อยู่ชิดขวา) -->
            <div class="flex items-center">
                <!-- ปุ่มเปลี่ยนรหัสผ่าน (ไม่มีอีโมจิ สไตล์มินิมอล) -->
                <button onclick="openPasswordModal()" class="text-xs font-bold text-gray-500 hover:text-indigo-600 transition-colors uppercase tracking-wider mr-3 sm:mr-4">
                    Change Password
                </button>
                
                <!-- เส้นคั่นแนวตั้ง (Divider) -->
                <div class="h-4 w-px bg-gray-300 mr-3 sm:mr-4"></div>
                
                <!-- ปุ่มออกจากระบบ (มีกรอบ ดูเป็นปุ่ม Action หลัก) -->
                <button onclick="logout()" class="text-xs border border-gray-300 text-gray-600 px-3 py-1.5 rounded hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 transition-all uppercase font-bold whitespace-nowrap">
                    Sign Out
                </button>
            </div>

        </div>
    </header>

    <nav class="chula-navy shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-12 flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-white font-bold tracking-widest text-sm uppercase">Space Reservation</span>
            </div>
            <div id="user-display" class="text-white/90 text-[11px] sm:text-xs italic font-medium bg-black/20 px-4 py-1.5 rounded-full text-center tracking-wide flex items-center justify-center">
                Loading Profile...
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto py-8 px-4 sm:px-6 lg:px-8 flex flex-col lg:flex-row gap-8">
        
        <div class="flex-1 min-w-0 bg-white p-4 sm:p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
            
            <div class="flex border-b border-gray-200 mb-4 overflow-x-auto custom-scrollbar">
                <button id="tab-timetable" onclick="switchTab('timetable')" 
                    class="py-2.5 px-6 font-bold text-sm border-b-2 border-indigo-600 text-indigo-700 focus:outline-none uppercase tracking-wider whitespace-nowrap transition-colors">
                    Timetable
                </button>
                <button id="tab-my-booking" onclick="switchTab('my-booking')" 
                    class="py-2.5 px-6 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 hover:border-gray-300 focus:outline-none uppercase tracking-wider whitespace-nowrap transition-colors">
                    My Reservations
                </button>
            </div>

            <div id="content-timetable" class="space-y-4">
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded-lg border w-full sm:w-fit">
                    <label for="view-date" class="text-sm font-semibold text-gray-700 whitespace-nowrap">Select Date:</label>
                    <input type="date" id="view-date" onchange="loadSchedule()" 
                        class="rounded-md border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-600 w-full sm:w-auto">
                </div>
                <div id="timetable-container" class="w-full"></div>
            </div>

            <div id="content-my-booking" class="hidden">
                <div id="my-reservations-container" class="w-full"></div>
            </div>

        </div>

        <div class="w-full lg:w-[350px] bg-white p-6 rounded-lg shadow-sm border border-gray-200 h-fit shrink-0">
            <h2 class="text-lg font-bold mb-4 text-gray-800 border-b border-gray-200 pb-3">Booking Request</h2>
            
            <form id="booking-form" class="space-y-4">
                <div>
                    <label for="name" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Lecturer Name</label>
                    <input type="text" id="name" readonly required class="w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-500 cursor-not-allowed outline-none">
                </div>

                <div>
                    <label for="staffId" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Staff ID</label>
                    <input type="text" id="staffId" readonly required class="w-full rounded-md border border-gray-300 bg-gray-50 px-3 py-2 text-sm text-gray-500 cursor-not-allowed outline-none">
                </div>

                <div>
                    <label for="room" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Room Selection</label>
                    <select id="room" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600">
                        <option value="">-- Select Room --</option>
                    </select>
                    <div id="room-image-container" class="mt-3 hidden">
                        <img id="room-image" src="" alt="Room Preview" class="w-full h-32 object-cover rounded-md border border-gray-200 shadow-sm">
                    </div>
                </div>

                <div>
                    <label for="date" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Reservation Date</label>
                    <input type="date" id="date" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600">
                </div>

                <div class="flex gap-4">
                    <div class="flex-1">
                        <label for="startTime" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Start Time</label>
                        <select id="startTime" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"></select>
                    </div>
                    <div class="flex-1">
                        <label for="endTime" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">End Time</label>
                        <select id="endTime" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"></select>
                    </div>
                </div>

                <div>
                    <label for="reason" class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wider">Purpose / Remarks</label>
                    <textarea id="reason" rows="3" required placeholder="Describe the purpose of your reservation..." class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 focus:ring-indigo-600"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-bold text-white chula-navy hover:opacity-90 focus:outline-none transition-all uppercase tracking-widest mt-2">
                    Submit Request
                </button>
            </form>
        </div>
    </main>

    <script src="js/config.js?v=2.5"></script>
    <script src="js/main.js?v=20260721-compact-v1"></script>

    <div id="password-modal" class="hidden fixed inset-0 z-[9999] flex items-center justify-center bg-black/60 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 transform transition-all border border-gray-100 mx-4">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-lg font-bold text-gray-800 tracking-wide uppercase">Change Password</h3>
                <button onclick="closePasswordModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
            </div>
            
            <form id="change-password-form" onsubmit="handleChangePasswordSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Current Password</label>
                    <input type="password" id="old-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1 bg-gray-50">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">New Password</label>
                    <input type="password" id="new-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Confirm New Password</label>
                    <input type="password" id="confirm-password" required class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-600 focus:ring-1">
                </div>
                
                <button type="submit" id="change-pw-submit-btn" onclick="handleChangePasswordSubmit(event)" class="w-full bg-indigo-600 text-white font-bold py-3.5 rounded-xl hover:bg-indigo-700 transition-all uppercase tracking-widest text-xs mt-4 shadow-md">
                    Update Password
                </button>
            </form>
        </div>
    </div>



</body>
</html>
