<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Space Reservation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; }
        .admin-red { background-color: #8b0000; }
        /* สไตล์สำหรับตาราง Grid เวลา */
        .grid-table th, .grid-table td { min-width: 90px; text-align: center; }
        .grid-table th:first-child, .grid-table td:first-child { min-width: 200px; text-align: left; position: sticky; left: 0; background-color: white; z-index: 10; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <header class="bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img src="logo.png" alt="Logo" class="h-16">
                <div>
                    <h1 class="text-lg font-bold text-gray-800 leading-tight">Department of Mining and Petroleum Engineering</h1>
                    <p class="text-sm text-gray-600 uppercase tracking-tighter">Faculty of Engineering, Chulalongkorn University</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs border border-gray-300 text-gray-600 px-3 py-1.5 rounded hover:bg-gray-100 transition-colors uppercase font-medium">
                Log Out
            </button>
        </div>
    </header>

    <nav class="admin-red shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-12 flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-white font-bold tracking-widest text-sm uppercase">Space Reservation - Admin Control</span>
            </div>
            <div id="admin-display" class="text-white/90 text-xs italic font-medium bg-black/20 px-3 py-1 rounded-full">
                ADMINISTRATION PANEL
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto py-8 px-4 sm:px-6 lg:px-8">
        
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            
            <div class="flex border-b border-gray-200 mb-6 justify-between items-end">
                <div class="flex gap-2">
                    <button id="tab-management" onclick="switchAdminTab('management')" 
                        class="py-2.5 px-6 font-semibold text-sm border-b-2 border-red-800 text-red-800 focus:outline-none uppercase tracking-wider">
                        Booking Management
                    </button>
                    <button id="tab-room-status" onclick="switchAdminTab('room-status')" 
                        class="py-2.5 px-6 font-medium text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 focus:outline-none uppercase tracking-wider">
                        Room Status
                    </button>
                </div>
                <button onclick="loadAdminSchedule()" class="mb-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded shadow-sm transition-colors flex items-center gap-2 border border-gray-300">
                    ↻ Refresh Data
                </button>
            </div>
            
            <div id="content-management" class="overflow-x-auto min-h-[400px]">
                <div id="admin-table-container" class="flex items-center justify-center bg-gray-50 rounded border border-gray-200 min-h-[300px]">
                    <p class="text-gray-500 text-sm animate-pulse">กำลังโหลดข้อมูล...</p>
                </div>
            </div>

            <div id="content-room-status" class="hidden space-y-4">
                <div class="flex items-center gap-3 bg-gray-50 p-3 rounded border w-fit">
                    <label for="admin-view-date" class="text-sm font-semibold text-gray-700">Select Date:</label>
                    <input type="date" id="admin-view-date" onchange="loadAdminSchedule()" 
                        class="rounded border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:border-red-800">
                </div>
                <div id="admin-timetable-container" class="overflow-x-auto border rounded-lg bg-gray-50 min-h-[300px]">
                    </div>
            </div>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
